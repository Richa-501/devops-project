<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>My Notes App</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f2f4f8;
      margin: 0;
      padding: 40px 16px;
    }
    .card {
      max-width: 500px;
      margin: 0 auto;
      background: white;
      padding: 24px 28px;
      border-radius: 10px;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
    }
    h1 {
      margin-top: 0;
      color: #2c3e50;
    }
    .status {
      color: #27ae60;
      font-weight: bold;
    }
    form {
      display: flex;
      gap: 8px;
      margin: 20px 0;
    }
    input {
      flex: 1;
      padding: 10px;
      border: 1px solid #ccc;
      border-radius: 6px;
      font-size: 16px;
    }
    button {
      padding: 10px 18px;
      background: #3498db;
      color: white;
      border: none;
      border-radius: 6px;
      font-size: 16px;
      cursor: pointer;
    }
    button:hover {
      background: #2980b9;
    }
    ul {
      padding-left: 20px;
    }
    li {
      padding: 6px 0;
      border-bottom: 1px solid #eee;
    }
  </style>
</head>
<body>
  <div class="card">
    <h1>My Notes App</h1>
    <p class="status">Status: running</p>

    <form method="post" action="/notes">
      <input name="text" placeholder="Write a note" required>
      <button type="submit">Save</button>
    </form>

    <h2>Saved notes</h2>
    <ul>
      {% for n in notes %}
        <li>{{ n }}</li>
      {% endfor %}
    </ul>
  </div>
</body>
</html>
