apiVersion: apps/v1
kind: Deployment
metadata:
  name: flask
  labels:
    app: flask
spec:
  replicas: 2
  selector:
    matchLabels:
      app: flask
  template:
    metadata:
      labels:
        app: flask
    spec:
      containers:
        - name: flask
          image: notes-app:latest
          imagePullPolicy: Never
          env:
           - name: DB_HOST
             value: postgres
           - name: DB_NAME
             valueFrom:
               secretKeyRef:
                 name: postgres-secret
                 key: POSTGRES_DB
           - name: DB_USER
             valueFrom:
               secretKeyRef:
                 name: postgres-secret
                 key: POSTGRES_USER
           - name: DB_PASSWORD
             valueFrom:
               secretKeyRef:
                 name: postgres-secret
                 key: POSTGRES_PASSWORD
          ports:
            - containerPort: 5000  
