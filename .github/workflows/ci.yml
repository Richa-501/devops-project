name: CI

on:
  push:
    branches: [main]


jobs:
  test:
    runs-on: ubuntu-latest
    steps:
        - uses: actions/checkout@v4
        - run:  cp .env.example .rnv
        - run: docker compose up -d --build
        - run: sleep 20
        - run: pip install requests pytest
        - run: python -m pytest
        - name: Show logs if failed
          if: failure()
          run: docker compose logs
